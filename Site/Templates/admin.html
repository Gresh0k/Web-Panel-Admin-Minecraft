<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание Администратора</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; color: #fff; padding: 20px; }
        .container { max-width: 400px; margin: 50px auto; background: #34495e; padding: 30px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: none; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:hover { background: #d35400; }
        .flash { color: #ff7675; text-align: center; }
        .success { color: #55efc4; }
        a { color: #74b9ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👑 Создание Администратора</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <p class="flash">{{ msg }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Никнейм админа" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Создать</button>
        </form>
        <p style="text-align: center; margin-top: 20px;"><a href="/">← Вернуться на главную</a></p>
    </div>
</body>
</html>
