<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание администратора</title>
    <style>
        :root {
            --bg-color: #1e1e2f;
            --card-bg: #2a2a40;
            --accent: #6c5ce7;
            --accent-hover: #5848c2;
            --danger: #ff4757;
            --success: #2ed573;
            --text: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-top: 0; color: var(--text); }

        .flash {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .flash.error { background: rgba(255, 71, 87, 0.15); color: #ff6b81; border: 1px solid var(--danger); }
        .flash.success { background: rgba(46, 213, 115, 0.15); color: #7bed9f; border: 1px solid var(--success); }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1e1e2f;
            border: 1px solid #444;
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--accent); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn-primary { background: var(--accent); color: white; margin-bottom: 10px; }
        .btn-primary:hover { background: var(--accent-hover); }
        
        .btn-secondary { background: #57606f; color: white; }
        .btn-secondary:hover { background: #747d8c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👑 Создание администратора</h2>

        <!-- Блок для отображения сообщений об ошибках или успехе -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('create_admin') }}">
            <input type="text" name="username" placeholder="Логин нового админа" required autocomplete="off">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit" class="btn btn-primary">Создать</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn btn-secondary">← Вернуться на карту</a>
    </div>
</body>
</html>
